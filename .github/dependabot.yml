#
# Only github-actions is listed, and that is deliberate. glassosd has no
# package manifest for Dependabot to read — its dependencies are distribution
# packages (Qt, KF6, layer-shell-qt) resolved by dnf/pacman at build time, and
# no ecosystem Dependabot supports describes them. Adding a cargo/npm/pip entry
# here would sit there doing nothing.
#
# Pinned Action versions in the workflows are a real supply-chain surface
# though, and that is what this keeps current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
