name: Feature request
description: Suggest something glassosd should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: |
        The situation, not the solution. "My notifications pile up after
        waking from suspend" is more useful than "add a queue setting".
    validations: {required: true}

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations: {required: false}

  - type: input
    id: prior
    attributes:
      label: Prior art
      description: Does dunst, swaync, mako or another shell do this already?
