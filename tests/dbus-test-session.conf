<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  SPDX-FileCopyrightText: 2026 glassosd contributors
  SPDX-License-Identifier: GPL-2.0-or-later

  A session bus for tests that can start nothing.

  The stock session configuration includes the standard service directories,
  so a name nobody owns gets activated from them — and a desktop's activation
  file for org.freedesktop.Notifications may well start
  the real session's daemon through systemd. A test bus must not be able to
  reach out of itself like that, and a test of "no daemon is present" is
  meaningless if the bus quietly starts one.
-->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
